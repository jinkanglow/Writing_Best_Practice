name: Quality
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: node bin/writing-quality.js rules validate
      - run: node bin/writing-quality.js analyze examples/article.md --output /tmp/report.json
